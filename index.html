<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de Tragos - SNACK Ristrel</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <header>
        <a href="https://snackbowling.com.ar/">
            <img src="images/logo-snack-ristrel.png" class="logo-img" alt="SNACK">
        </a>
        <h1>Carta de Tragos</h1>
    </header>

    <div class="controls-wrapper">
        <input type="text" id="itemSearch" placeholder="Buscá tu trago o ingrediente...">
        <div class="filter-scroller">
            <div class="filter-pills">
                <div class="pill active" data-filter="all">Todos</div>
                <div class="pill" data-filter="cerveza">Cervezas</div>
                <div class="pill" data-filter="gin">Gin</div>
                <div class="pill" data-filter="vodka">Vodka</div>
                <div class="pill" data-filter="ron">Ron</div>
                <div class="pill" data-filter="aperitivo">Aperitivos</div>
                <div class="pill" data-filter="frutal">Frutales</div>
                <div class="pill" data-filter="caipi">Caipis</div>
            </div>
            <button type="button" class="scroll-hint" aria-label="Ver más filtros">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </div>

    <div id="noResults">No hay coincidencias para tu búsqueda.</div>
    <div id="loadingState">Cargando carta...</div>
    <div id="menuContainer"></div>

    <div class="cta-container">
        <a href="https://menu.maxirest.com/408" class="btn-full-menu">Ver Menú de Comidas y Postres</a>
    </div>

    <footer>DISFRUTÁ CON MODERACIÓN • SNACK RISTREL</footer>
</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
